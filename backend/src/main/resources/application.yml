spring:
  application:
    name: detector-ofertas

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/detector_ofertas}
    username: ${DB_USER:detector}
    password: ${DB_PASSWORD:detector}

  jpa:
    open-in-view: false
    hibernate:
      # El schema lo maneja Flyway; Hibernate solo valida que las entidades coincidan.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
